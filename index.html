<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akshardham Business Suite</title>
<style>
:root{--bg:#faf6ef;--side:#3b1d0a;--ink:#f7e7cf;--mute:#d9b98a;--or:#fb923c;--gold:#b7791f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
aside{width:210px;background:var(--side);color:var(--ink);display:flex;flex-direction:column;border-right:4px solid var(--gold);flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
aside h1{margin:0;padding:16px 14px 2px;font-size:17px}aside p{margin:0;padding:0 14px 12px;color:var(--mute);font-size:12px}
nav{display:flex;flex-direction:column;overflow-y:auto}
nav button{background:none;border:0;border-left:4px solid transparent;color:var(--ink);text-align:left;padding:11px 14px;font:inherit;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:rgba(255,255,255,.12);border-left-color:var(--or);color:var(--or);font-weight:600}
nav button:focus-visible{outline:2px solid var(--or);outline-offset:-2px}
main{flex:1;position:relative;min-width:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}iframe.on{display:block}
#hi{padding:30px;color:#7a6a5a}
@media(max-width:700px){body{flex-direction:column}aside{width:100%;border-right:0;border-bottom:4px solid var(--gold)}aside p{display:none}aside h1{padding:10px 14px}
nav{flex-direction:row}nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:9px 12px}nav button.on{border-bottom-color:var(--or)}}
@media(prefers-color-scheme:dark){body{background:#17110c}#hi{color:#a8967f}}
</style></head><body>
<aside><h1>Akshardham Suite</h1><p>Saare apps ek jagah</p><nav id="nav"></nav></aside>
<main id="m"><div id="hi">Left se koi section chuno.</div></main>
<script>
var A=[["accounting","Accounting"],["invoicing","Invoicing"],["expense","Expenses"],["crm","CRM / Leads"],["contracts","Contracts"],["property-management","Property"],["inventory","Inventory"],["pos","Point of Sale"],["contacts","Contacts"]];
var nav=document.getElementById("nav"),m=document.getElementById("m");
A.forEach(function(a){var b=document.createElement("button");b.textContent=a[1];b.dataset.k=a[0];b.onclick=function(){open_(a[0])};nav.appendChild(b)});
function open_(k){
 var h=document.getElementById("hi");if(h)h.remove();
 var f=document.getElementById("f_"+k);
 if(!f){f=document.createElement("iframe");f.id="f_"+k;f.src=k+"/";f.title=k;f.allow="clipboard-write; fullscreen";m.appendChild(f)}
 m.querySelectorAll("iframe").forEach(function(i){i.classList.toggle("on",i===f)});
 nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.k===k)});
 try{history.replaceState(null,"","#"+k)}catch(e){}}
var h=location.hash.slice(1);open_(A.some(function(a){return a[0]==h})?h:"accounting");
</script></body></html>
